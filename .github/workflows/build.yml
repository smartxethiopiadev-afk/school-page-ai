name: Build School Page AI (Full APKs + Shorebird OTA)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Select Build / Update System"
        required: true
        default: "shorebird_release"
        type: choice
        options:
          - shorebird_release    # 1. ሙሉ Shorebird Universal APK
          - shorebird_patch      # 2. ፈጣን OTA Patch (ጥቂት KB ብቻ - በአፑ Update ቁልፍ የሚጫን)
          - classic_multi_apk    # 3. ክላሲክ ሙሉ 3 አይነት APK + Windows EXE

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1 & 2. SHOREBIRD SYSTEM (UNIVERSAL APK OR OTA PATCH)
  # =========================================================================
  shorebird-android:
    name: Shorebird Build (${{ github.event.inputs.update_mode || 'shorebird_release' }})
    if: github.event.inputs.update_mode != 'classic_multi_apk'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Setup Flutter (Dart >= 3.10.7)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Create Android Support Files Automatically
        run: flutter create . --platforms=android

      - name: Configure Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'
          ]
          for perm in perms:
              if perm not in s:
                  pos = s.find("<application")
                  s = s[:pos] + "    " + perm + "\n    " + s[pos:]
          p.write_text(s)
          PY

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Initialize Shorebird & Save Config
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ ! -f "shorebird.yaml" ]; then
            shorebird init --force
            git config --global user.name "GitHub Action"
            git config --global user.email "action@github.com"
            git add shorebird.yaml
            git commit -m "chore: add shorebird.yaml [skip ci]"
            git push
          fi

      - name: Execute Shorebird Release or Patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.update_mode }}"
          if [ "$MODE" == "shorebird_patch" ]; then
            echo "Pushing Fast OTA Patch..."
            shorebird patch android
          else
            echo "Building Full Shorebird Universal APK..."
            shorebird release android --artifact apk
          fi

      - name: Upload Shorebird Universal APK
        if: github.event.inputs.update_mode != 'shorebird_patch'
        uses: actions/upload-artifact@v4
        with:
          name: School-Page-AI-Shorebird-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # =========================================================================
  # 3. CLASSIC FALLBACK SYSTEM (ALWAYS FULL 3-TYPE APKs + WINDOWS EXE)
  # =========================================================================
  classic-android:
    name: Classic Full 3-Architecture Android APKs
    if: github.event.inputs.update_mode == 'classic_multi_apk'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Create Android Support Files Automatically
        run: flutter create . --platforms=android

      - name: Enable Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'
          ]
          for perm in perms:
              if perm not in s:
                  pos = s.find("<application")
                  s = s[:pos] + "    " + perm + "\n    " + s[pos:]
          p.write_text(s)
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Full Universal APK
        run: flutter build apk --release

      - name: Build Full Split APKs (64-bit & 32-bit)
        run: flutter build apk --release --split-per-abi

      - name: Upload Classic Full 3-Type APKs
        uses: actions/upload-artifact@v4
        with:
          name: School-Page-AI-Classic-Full-APKs
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  classic-windows:
    name: Classic Windows EXE
    if: github.event.inputs.update_mode == 'classic_multi_apk'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Create Windows Support
        run: flutter create . --platforms=windows

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows App
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "School-Page-AI-Windows.zip" `
            -Force

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: School-Page-AI-Windows
          path: School-Page-AI-Windows.zip

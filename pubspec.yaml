name: ethio_edu_ai
description: "100% Offline AI tutor for Ethiopian Class 9-12 students (PWA, Android & Windows)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # የ AI ሞዴል ፋይሎችን ወይም የትምህርት መጽሐፍ ዳታዎችን እዚህ ጋር ማስገባት ይችላሉ
  assets:
    - assets/
